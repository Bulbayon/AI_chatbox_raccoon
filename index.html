<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Guild - Kaiza's Tavern</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #2c1d11;
            color: #f4e8c1;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            background-color: #422b19;
            border: 4px solid #8c5a2b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .header {
            background-color: #5c3a1d;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #8c5a2b;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .user {
            align-self: flex-end;
            background-color: #8c5a2b;
            color: #fff;
        }
        .kaiza {
            align-self: flex-start;
            background-color: #213c27;
            color: #e2f2cd;
            border: 1px solid #488052;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #311f12;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #8c5a2b;
            background-color: #1a100a;
            color: #fff;
            font-size: 1rem;
        }
        button {
            padding: 10px 20px;
            margin-left: 8px;
            background-color: #8c5a2b;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #a66c35;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">🦝 Maple Guild Hall - Kaiza's Desk</div>
        <div class="chat-box" id="chatBox">
            <div class="message kaiza">Welcome to the Maple Guild Hall! I'm Kaiza, the Guild Leader! What brings you here today, adventurer? 🦝</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Speak to Kaiza..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            // Display user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatBox.appendChild(userMsg);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Show temporary thinking state
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message kaiza';
            loadingMsg.textContent = 'Kaiza is thinking... 🦝';
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                loadingMsg.textContent = data.response || data.detail;
            } catch (err) {
                loadingMsg.textContent = 'Kaiza seems out of reach right now... 🦝';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
